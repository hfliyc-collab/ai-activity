<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 活动</title>
<style>
:root {
  color-scheme: light dark;
  --label: rgba(0,0,0,.86); --label2: rgba(60,60,67,.62); --label3: rgba(60,60,67,.38);
  --fill: rgba(255,255,255,.52); --fill-hover: rgba(255,255,255,.72); --track: rgba(0,0,0,.08);
  --hairline: rgba(0,0,0,.07);
  --blue: #007AFF; --orange: #FF9500; --green: #34C759; --red: #FF3B30; --gray: #8E8E93;
  --glow-a: #4F8CFF; --glow-b: #A35CFF; --glow-c: #FF6FB1;
  --done-tint: rgba(52,199,89,.14);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
  --display: -apple-system, "SF Pro Display", "Segoe UI Variable Display", "PingFang SC", "Microsoft YaHei UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --label: rgba(255,255,255,.92); --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.32);
    --fill: rgba(255,255,255,.07); --fill-hover: rgba(255,255,255,.12); --track: rgba(255,255,255,.1);
    --hairline: rgba(255,255,255,.08);
    --blue: #0A84FF; --orange: #FF9F0A; --green: #30D158; --red: #FF453A; --gray: #98989D;
    --done-tint: rgba(48,209,88,.16);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: transparent; }
body { font: 13px/1.35 var(--sans); color: var(--label); -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none; cursor: default; overflow-y: auto; }
::-webkit-scrollbar { display: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
#app { padding: 0 10px 10px; width: 340px; }

/* 顶部 */
header { height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 6px; }
header .head-text { flex: 1; min-width: 0; }
header h1 { font: 600 15px/1.2 var(--display); letter-spacing: -.01em; }
header .sum { font-size: 11.5px; color: var(--label2); font-variant-numeric: tabular-nums; margin-top: 2px; }
header svg.spark { width: 104px; height: 30px; flex: none; overflow: visible; }
.comp-slot { flex: none; width: 40px; height: 40px; display: none; }
body.companion .comp-slot { display: block; }

/* 额度 */
#quota { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
.acct { padding: 10px 12px; border-radius: 14px; background: var(--fill); box-shadow: inset 0 0 0 .5px var(--hairline); }
.a-head { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
.a-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.a-sub { font-size: 11px; color: var(--label3); white-space: nowrap; }
.a-age { margin-left: auto; font-size: 10.5px; color: var(--label3); white-space: nowrap; }
.wline { display: grid; grid-template-columns: 54px 1fr 38px; align-items: center; column-gap: 8px; font-size: 11.5px; padding: 2px 0; }
.wline + .wline { margin-top: 3px; }
.wline .w-label { color: var(--label2); white-space: nowrap; }
.wline .w-val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.wline .w-reset { grid-column: 2 / 4; font-size: 10.5px; color: var(--label3); line-height: 1.25; margin-top: 2px; }
.bar { height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--blue); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.lv-mid .bar i, .wl-mid .bar i { background: var(--orange); }
.lv-high .bar i, .wl-high .bar i { background: var(--red); }
.wl-mid .w-val { color: var(--orange); } .wl-high .w-val { color: var(--red); }
.bal { font-size: 12px; color: var(--label2); } .bal b { font-size: 15px; color: var(--label); font-variant-numeric: tabular-nums; margin-left: 6px; }
.lv-high .bal b { color: var(--red); }
.a-err { font-size: 11.5px; color: var(--orange); margin-top: 4px; }
.mini { width: 17px; height: 17px; border-radius: 5px; display: grid; place-items: center; flex: none;
  background: linear-gradient(145deg, var(--a), var(--b)); color: #fff; font: 600 9px/1 var(--sans); }

/* 单账号（菜单栏弹出） */
.one { padding: 14px 14px 12px; border-radius: 16px; background: var(--fill); box-shadow: inset 0 0 0 .5px var(--hairline); margin-bottom: 8px; }
.one-top { display: flex; align-items: center; gap: 8px; }
.one-top .a-name { flex: 1; }
.sw { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; color: var(--label2); }
.sw:hover { background: var(--fill-hover); color: var(--label); }
.sw[disabled] { opacity: .25; pointer-events: none; }
.big { font: 600 40px/1.05 var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 12px 0 2px; }
.lv-mid .big { color: var(--orange); } .lv-high .big { color: var(--red); }
.big-sub { font-size: 11.5px; color: var(--label2); margin-bottom: 10px; }
.dots { display: flex; gap: 5px; justify-content: center; margin-top: 8px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--label3); }
.dots i.on { background: var(--label); }

/* 进行中 */
.list { display: flex; flex-direction: column; gap: 6px; }
.row { position: relative; display: grid; grid-template-columns: 34px 1fr; gap: 11px; padding: 10px 12px 10px 10px;
  border-radius: 14px; background: var(--fill); box-shadow: inset 0 0 0 .5px var(--hairline); transition: background .2s ease; }
.row.clickable:hover { background: var(--fill-hover); }
.row.flash { animation: flash 1.6s ease-out 2; }
@keyframes flash { 0% { background: var(--done-tint); } 100% { background: var(--fill); } }
.glyph { position: relative; width: 34px; height: 34px; }
.glyph .tile { position: absolute; inset: 3px; border-radius: 8px; background: linear-gradient(145deg, var(--a), var(--b));
  color: #fff; display: grid; place-items: center; font: 600 13px/1 var(--sans); letter-spacing: -.02em;
  box-shadow: inset 0 .5px 0 rgba(255,255,255,.35), 0 1px 2px rgba(0,0,0,.18); }
.ring { position: absolute; inset: 0; border-radius: 11px; opacity: 0; padding: 2px;
  background: conic-gradient(from var(--ang, 0deg), transparent 0 18%, var(--glow-a) 45%, var(--glow-b) 72%, var(--glow-c) 88%, transparent 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.row.working .ring { opacity: 1; animation: spin 1.6s linear infinite; }
.row.waiting .ring { opacity: 1; background: var(--orange); animation: breathe 1.4s ease-in-out infinite; }
@property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
@keyframes spin { to { --ang: 360deg; } }
@keyframes breathe { 50% { opacity: .35; } }
.glyph .badge { position: absolute; right: -2px; bottom: -2px; width: 15px; height: 15px; border-radius: 50%;
  display: none; place-items: center; color: #fff; box-shadow: 0 0 0 2px var(--badge-ring, rgba(30,30,32,.9)); }
@media (prefers-color-scheme: light) { .glyph .badge { --badge-ring: rgba(246,246,248,.95); } }
.row.done .badge { display: grid; background: var(--green); }
.row.error .badge { display: grid; background: var(--red); }
.row.stopped .badge { display: grid; background: var(--gray); }
.badge svg { width: 9px; height: 9px; }
.main { min-width: 0; }
.l1 { display: flex; align-items: baseline; gap: 6px; }
.l1 .name { font-weight: 600; white-space: nowrap; }
.l1 .place { font-size: 11px; color: var(--label3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.l1 .time { margin-left: auto; font-size: 11.5px; color: var(--label2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.title { color: var(--label2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.meta { display: flex; gap: 10px; align-items: baseline; margin-top: 5px; font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.meta .state { font-weight: 600; }
.row.working .meta .state { color: var(--blue); } .row.waiting .meta .state { color: var(--orange); }
.row.done .meta .state { color: var(--green); } .row.error .meta .state { color: var(--red); }
.row.stopped .meta .state, .row.stale .meta .state { color: var(--gray); }
.meta .num { color: var(--label); } .meta .dim { color: var(--label2); overflow: hidden; text-overflow: ellipsis; }

.section { margin: 12px 4px 6px; font-size: 11px; color: var(--label3); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 5px; border-radius: 13px;
  background: var(--fill); box-shadow: inset 0 0 0 .5px var(--hairline); font-size: 11.5px; max-width: 100%; }
.chip:hover { background: var(--fill-hover); }
.chip .where { color: var(--label3); }
.chip.unwatched .mini { filter: saturate(.25); opacity: .75; }
.notice { margin-top: 8px; padding: 9px 11px; border-radius: 12px; font-size: 11.5px; color: var(--label2);
  background: color-mix(in srgb, var(--orange) 12%, transparent); box-shadow: inset 0 0 0 .5px color-mix(in srgb, var(--orange) 30%, transparent); }
.notice b { color: var(--label); font-weight: 600; }
.notice .steps { display: none; margin-top: 6px; line-height: 1.55; }
.notice.open .steps { display: block; }
.empty { padding: 14px 8px 6px; }
.empty .big2 { font: 600 15px/1.3 var(--display); color: var(--label2); }
.empty .small { font-size: 12px; color: var(--label3); margin-top: 3px; }
.foot { display: none; gap: 6px; margin-top: 10px; }
.foot button { flex: 1; height: 30px; border-radius: 9px; background: var(--fill); box-shadow: inset 0 0 0 .5px var(--hairline); font-size: 12px; color: var(--label2); }
.foot button:hover { background: var(--fill-hover); color: var(--label); }
.focus-pick { display: none; gap: 6px; margin-top: 6px; }
.focus-pick.open { display: flex; }
.focus-pick button { flex: 1; height: 28px; border-radius: 8px; background: var(--fill); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.focus-pick button:hover { background: var(--fill-hover); }
body.popover .foot { display: flex; }
body.popover header { display: none; }
body.popover #app { padding-top: 10px; }

/* 绘本伙伴：小麻雀 */
.sparrow { width: 100%; height: 100%; overflow: visible; }
.sparrow .sp-head { transform-origin: 40px 30px; }
.sparrow .sp-all { transform-origin: 32px 56px; }
.sparrow .eye-c, .sparrow .bub { opacity: 0; }
.c-idle .eye-o { opacity: 0; } .c-idle .eye-c { opacity: 1; }
.c-idle .sp-all { animation: sp-breathe 3.2s ease-in-out infinite; }
.c-idle .bub-z { opacity: 1; animation: sp-z 3.2s ease-in-out infinite; }
.c-working .sp-head { animation: sp-peck .55s ease-in-out infinite; }
.c-waiting .sp-head { transform: rotate(-10deg); }
.c-waiting .bub-q { opacity: 1; animation: breathe 1.4s ease-in-out infinite; }
.c-done .sp-all { animation: sp-hop .7s cubic-bezier(.3,1.6,.5,1) 2; }
.c-done .bub-n { opacity: 1; }
@keyframes sp-breathe { 50% { transform: scale(1.03, .98); } }
@keyframes sp-peck { 0%, 100% { transform: rotate(0); } 40% { transform: rotate(16deg) translate(1px, 2px); } }
@keyframes sp-hop { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-6px); } }
@keyframes sp-z { 0%, 100% { opacity: 0; transform: translate(0, 0); } 50% { opacity: 1; transform: translate(2px, -3px); } }

/* 刘海 / 灵动岛：岛本身只占刘海和两侧真实空余的位置；展开内容是菜单栏下方的独立下拉面板 */
body.island, body.drop { overflow: hidden; --label: rgba(255,255,255,.92); --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.34);
  --fill: rgba(255,255,255,.08); --fill-hover: rgba(255,255,255,.14); --track: rgba(255,255,255,.12); --hairline: rgba(255,255,255,.06);
  --blue: #0A84FF; --orange: #FF9F0A; --green: #30D158; --red: #FF453A; --badge-ring: #000; }
body.island #app { display: none; }
#isl { display: none; position: absolute; left: 0; top: 0; width: 100%; height: var(--ih); background: #000;
  border-radius: 0 0 var(--ir) var(--ir); cursor: pointer; }
body.island #isl { display: block; }
body.m-none #isl { border-radius: 0 0 10px 10px; }   /* 只占刘海本身：黑色落在刘海上，看不见 */
.wing { position: absolute; display: flex; align-items: center; gap: 6px; color: #fff; white-space: nowrap;
  font: 600 12.5px/1 var(--display); font-variant-numeric: tabular-nums; }
.wing { top: 0; height: var(--ih); }
.wing.l { left: 0; width: var(--lw); padding-left: 12px; }
.wing.r { right: 0; width: var(--rw); padding-right: 12px; justify-content: flex-end; }
body.m-none .wing { display: none; }
body.m-left .wing.r, body.m-right .wing.l { display: none; }
.only-left, .only-right { display: none; }
body.m-left .only-left, body.m-right .only-right { display: inline-flex; }
body.m-wings .wing.l .pct { display: none; }
.dot { width: 14px; height: 14px; border-radius: 50%; position: relative; flex: none; background: rgba(255,255,255,.18); }
.dot.working { background: conic-gradient(from var(--ang, 0deg), transparent 0 15%, var(--glow-a) 45%, var(--glow-b) 72%, var(--glow-c) 90%, transparent);
  -webkit-mask: radial-gradient(circle, transparent 3.5px, #000 4px); animation: spin 1.4s linear infinite; }
.dot.waiting { background: var(--orange); animation: breathe 1.4s ease-in-out infinite; }
.dot.done { background: var(--green); }
.icomp { width: 22px; height: 22px; display: none; flex: none; }
body.companion .icomp { display: block; } body.companion .dot { display: none; }
.pct.mid { color: var(--orange); } .pct.high { color: var(--red); }
/* 下拉面板 */
body.drop #app { width: 380px; margin: 0; padding: 12px; background: #0b0b0c; border-radius: 22px;
  box-shadow: inset 0 0 0 .5px rgba(255,255,255,.08); }
.qline { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; background: var(--fill); font-size: 12px; }
.qline .a-name { flex: 1; font-weight: 500; }
.qline .qv { font-variant-numeric: tabular-nums; color: var(--label2); white-space: nowrap; }
.qline .qv b { color: var(--label); font-weight: 600; margin-left: 3px; }
.qline .qv.mid b { color: var(--orange); } .qline .qv.high b { color: var(--red); }
body.drop .foot { display: flex; } body.drop header { display: none; }

/* Windows 11 */
html.win body { background: radial-gradient(120% 70% at 0% 0%, rgba(0,103,192,.07), transparent 60%), #F3F3F3; }
@media (prefers-color-scheme: dark) { html.win body { background: radial-gradient(120% 70% at 0% 0%, rgba(96,205,255,.06), transparent 60%), #202020; } }
html.win .glyph .badge { --badge-ring: #202020; }
@media (prefers-color-scheme: light) { html.win .glyph .badge { --badge-ring: #F3F3F3; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="isl">
  <div class="wing l"><span class="dot"></span><span class="icomp"></span><span class="cnt"></span><span class="pct only-left"></span></div>
  <div class="wing r"><span class="dot only-right"></span><span class="cnt only-right"></span><span class="pct"></span></div>
</div>
<div id="app">
  <header class="pywebview-drag-region">
    <div class="comp-slot" id="hcomp"></div>
    <div class="head-text"><h1>AI 活动</h1><div class="sum" id="sum">正在查找打开的 AI…</div></div>
    <svg class="spark" id="spark" viewBox="0 0 104 30" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="var(--glow-a)" stop-opacity=".2"/><stop offset=".6" stop-color="var(--glow-b)"/><stop offset="1" stop-color="var(--glow-c)"/></linearGradient>
        <linearGradient id="gf" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--glow-b)" stop-opacity=".28"/><stop offset="1" stop-color="var(--glow-b)" stop-opacity="0"/></linearGradient>
      </defs>
      <path id="sparkFill" fill="url(#gf)"/><path id="sparkLine" fill="none" stroke="url(#g)" stroke-width="1.6" stroke-linecap="round"/>
      <circle id="sparkDot" r="2.2" fill="var(--glow-c)"/>
    </svg>
  </header>
  <div id="quota"></div>
  <div class="list" id="list"></div>
  <div id="notices"></div>
  <div id="idleWrap"></div>
  <div class="foot"><button data-act="focus">专注一会儿</button><button data-act="settings">设置…</button></div>
  <div class="focus-pick" id="fpick"><button data-min="15">15 分钟</button><button data-min="60">1 小时</button><button data-min="180">3 小时</button><button data-min="300">5 小时</button></div>
</div>

<script>
const Q = new URLSearchParams(location.search);
const VIEW = Q.get('view') || 'sidebar';
document.body.classList.add(VIEW);
if (Q.get('platform') === 'win') document.documentElement.classList.add('win');
const bridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.aiw;
const HTTP = !bridge && location.protocol.startsWith('http');
const send = (o) => { o = Object.assign({ view: VIEW }, o); return bridge ? bridge.postMessage(JSON.stringify(o))
  : HTTP ? fetch('/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(o) }).catch(() => {}) : null; };
if (VIEW === 'popover') window.addEventListener('blur', () => send({ type: 'blur' }));
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = (id) => document.getElementById(id);
const STATE = { working: '生成中', waiting: '等你确认', done: '已完成', error: '出错了', stopped: '已停止' };
const CHECK = '<svg viewBox="0 0 10 10"><path d="M2 5.3l2 2 4-4.6" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CROSS = '<svg viewBox="0 0 10 10"><path d="M3 3l4 4M7 3l-4 4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>';
const STOP = '<svg viewBox="0 0 10 10"><rect x="3" y="3" width="4" height="4" rx=".8" fill="#fff"/></svg>';
const fmtTok = (n) => n >= 10000 ? (n / 1000).toFixed(1) + 'k' : n.toLocaleString('en-US');
function fmtDur(s) { s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; }
const ago = (s) => s < 60 ? '刚刚' : s < 3600 ? `${Math.floor(s / 60)} 分钟前` : `${Math.floor(s / 3600)} 小时前`;
function resetIn(s) { if (s == null) return ''; if (s <= 60) return '即将重置';
  if (s < 3600) return `${Math.ceil(s / 60)} 分钟后重置`; if (s < 86400) return `${Math.round(s / 3600)} 小时后重置`; return `${Math.round(s / 86400)} 天后重置`; }
const lv = (u) => u >= 90 ? 'high' : u >= 70 ? 'mid' : 'ok';
function setText(el, v) { if (el.textContent !== v) el.textContent = v; }
function setHTML(el, h) { if (el.dataset.h !== h) { el.innerHTML = h; el.dataset.h = h; } }
const mini = (a) => `<span class="mini" style="--a:${a.tint[0]};--b:${a.tint[1]}">${esc(a.glyph)}</span>`;

/* ---------- 绘本伙伴：原创小麻雀 ---------- */
const SPARROW = `<svg class="sparrow" viewBox="0 0 64 64" aria-hidden="true"><g class="sp-all">
  <path d="M10 42 L2 50 L13 49 Z" fill="#7A4E2C"/>
  <ellipse cx="29" cy="41" rx="19" ry="15" fill="#B7834F"/>
  <ellipse cx="33" cy="46" rx="12" ry="9" fill="#F2E2C4"/>
  <path d="M15 37 Q24 29 35 37 Q27 48 15 44 Z" fill="#8B5B35"/><path d="M19 39 Q25 36 30 40 M18 42 Q24 40 28 43" stroke="#C99A68" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M27 55 v5 M33 55 v5" stroke="#C98B46" stroke-width="1.8" stroke-linecap="round"/>
  <g class="sp-head"><circle cx="40" cy="27" r="13" fill="#B7834F"/><path d="M28 24 Q34 12 47 15 Q42 20 31 27 Z" fill="#7A4E2C"/>
    <circle cx="45" cy="31" r="3.2" fill="#F3A68F" opacity=".75"/>
    <g class="eye-o"><circle cx="44" cy="25" r="2.7" fill="#2B1E16"/><circle cx="45" cy="24" r=".9" fill="#fff"/></g>
    <path class="eye-c" d="M41.5 25.5 Q44 27.5 46.5 25.5" stroke="#2B1E16" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M52 26 L60 28.5 L52 31 Z" fill="#E9A23B"/></g></g>
  <text class="bub bub-z" x="52" y="12" font-size="10" font-weight="700" fill="#8E8E93">z</text>
  <text class="bub bub-q" x="53" y="13" font-size="13" font-weight="800" fill="#FF9F0A">?</text>
  <text class="bub bub-n" x="52" y="13" font-size="12" font-weight="800" fill="#30D158">♪</text></svg>`;
$('hcomp').innerHTML = SPARROW; document.querySelectorAll('.icomp').forEach((e) => { e.innerHTML = SPARROW; });
function companionState(v) {
  const r = v.rows || [];
  if (r.some((x) => x.state === 'waiting')) return 'waiting';
  if (r.some((x) => x.state === 'working')) return 'working';
  if (r.some((x) => x.flash)) return 'done';
  return 'idle';
}

/* ---------- 进行中的任务 ---------- */
const nodes = new Map();
function rowNode(r) {
  let el = nodes.get(r.key);
  if (!el) {
    el = document.createElement('div');
    el.innerHTML = `<div class="glyph"><div class="ring"></div><div class="tile"></div><div class="badge"></div></div>
      <div class="main"><div class="l1"><span class="name"></span><span class="place"></span><span class="time"></span></div><div class="title"></div><div class="meta"></div></div>`;
    el.addEventListener('click', () => el.classList.contains('clickable') && send({ type: 'open', key: el.dataset.key }));
    nodes.set(r.key, el);
  }
  el.dataset.key = r.key;
  const cls = ['row', r.state, r.clickable && 'clickable', r.stale && 'stale', r.flash && 'flash'].filter(Boolean).join(' ');
  if (el.className !== cls) el.className = cls;
  const g = el.querySelector('.glyph'); g.style.setProperty('--a', r.tint[0]); g.style.setProperty('--b', r.tint[1]);
  setText(g.querySelector('.tile'), r.glyph);
  const b = g.querySelector('.badge');
  if (b.dataset.v !== r.state) { b.innerHTML = r.state === 'done' ? CHECK : r.state === 'error' ? CROSS : r.state === 'stopped' ? STOP : ''; b.dataset.v = r.state; }
  setText(el.querySelector('.name'), r.label); setText(el.querySelector('.place'), r.place || '');
  const active = r.state === 'working' || r.state === 'waiting';
  setText(el.querySelector('.time'), active ? fmtDur(r.elapsed) : ago(r.finished_ago || 0));
  const t = el.querySelector('.title'); setText(t, r.title || r.model || ''); t.style.display = (r.title || r.model) ? '' : 'none';
  let st = STATE[r.state] || r.state;
  if (r.stale) st = `${fmtDur(r.since_update)} 无更新`;
  if (!active && r.elapsed > 0) st += ` · 用时 ${fmtDur(r.elapsed)}`;
  const p = [`<span class="state">${esc(st)}</span>`];
  if (r.state === 'waiting' && r.note) p.push(`<span class="dim">${esc(r.note)}</span>`);
  else {
    if (r.tokens > 0) p.push(`<span class="num">${r.est ? '≈' : ''}${fmtTok(r.tokens)} tok</span>`);
    if (r.tps) p.push(`<span class="num">${Math.round(r.tps)} tok/s</span>`);
    if (r.ctx) p.push(`<span class="dim">上下文 ${fmtTok(r.ctx)}</span>`);
    if (r.note && active) p.push(`<span class="dim">${esc(r.note)}</span>`);
  }
  setHTML(el.querySelector('.meta'), p.join(''));
  return el;
}
function renderRows(rows) {
  const list = $('list'), keys = new Set(rows.map((r) => r.key));
  for (const [k, el] of nodes) if (!keys.has(k)) { el.remove(); nodes.delete(k); }
  const els = rows.map(rowNode), cur = Array.from(list.children).filter((e) => e.classList.contains('row'));
  if (els.length !== cur.length || els.some((e, i) => e !== cur[i])) els.forEach((e) => list.appendChild(e));
  const empty = $('empty');
  if (!rows.length && !empty) list.insertAdjacentHTML('beforeend', '<div class="empty" id="empty"><div class="big2">一切安静</div><div class="small">没有 AI 正在工作。</div></div>');
  if (rows.length && empty) empty.remove();
}

/* ---------- 额度 ---------- */
function windowsHTML(a) {
  if (a.windows.length) return a.windows.map((w) => `<div class="wline wl-${lv(w.util)}"><span class="w-label">${esc(w.label)}</span>
    <div class="bar"><i style="width:${Math.min(100, w.util)}%"></i></div><span class="w-val">${Math.round(w.util)}%</span>
    ${w.resets_in != null ? `<span class="w-reset">${resetIn(w.resets_in)}</span>` : ''}</div>`).join('');
  if (a.balance) return `<div class="bal">余额<b>${esc(a.headline)}</b></div>`;
  return '';
}
function cardHTML(a) {
  return `<div class="acct lv-${a.level}"><div class="a-head">${mini(a)}<span class="a-name">${esc(a.name)}</span><span class="a-sub">${esc(a.label)}</span>
    <span class="a-age">${a.stale ? ago(a.age) + '更新' : ''}</span></div>${windowsHTML(a)}${a.error ? `<div class="a-err">${esc(a.error)}</div>` : ''}</div>`;
}
let oneIdx = null;
function oneHTML(list, prefs) {
  if (oneIdx == null) { const i = list.findIndex((a) => a.id === (prefs.popover_account || prefs.primary)); oneIdx = i >= 0 ? i : 0; }
  oneIdx = Math.max(0, Math.min(oneIdx, list.length - 1));
  const a = list[oneIdx], w0 = a.windows.slice().sort((x, y) => y.util - x.util)[0];
  const sub = w0 ? `${w0.label}${w0.resets_in != null ? ' · ' + resetIn(w0.resets_in) : ''}` : a.balance ? '账户余额' : '';
  return `<div class="one lv-${a.level}"><div class="one-top">${mini(a)}<span class="a-name">${esc(a.name)}</span>
    <button class="sw" data-sw="-1" ${oneIdx === 0 ? 'disabled' : ''}>‹</button><button class="sw" data-sw="1" ${oneIdx === list.length - 1 ? 'disabled' : ''}>›</button></div>
    <div class="big">${esc(a.headline)}</div><div class="big-sub">${esc(a.label)}${sub ? ' · ' + esc(sub) : ''}</div>
    ${a.windows.length > 1 ? windowsHTML(a) : ''}${a.error ? `<div class="a-err">${esc(a.error)}</div>` : ''}
    ${list.length > 1 ? `<div class="dots">${list.map((_, i) => `<i class="${i === oneIdx ? 'on' : ''}"></i>`).join('')}</div>` : ''}</div>`;
}
function inlineHTML(a) {
  const parts = a.windows.length ? a.windows.slice(0, 2).map((w) => `<span class="qv ${lv(w.util)}">${esc(w.label)}<b>${Math.round(w.util)}%</b></span>`).join('')
    : `<span class="qv ${a.level}">余额<b>${esc(a.headline)}</b></span>`;
  return `<div class="qline">${mini(a)}<span class="a-name">${esc(a.name)}</span>${parts}</div>`;
}
let lastV = null;
function renderQuota(v) {
  const shown = (v.accounts || []).filter((a) => a.shown);
  const box = $('quota');
  if (!shown.length) { setHTML(box, ''); return; }
  if (VIEW === 'popover') setHTML(box, oneHTML(shown, v.prefs || {}));
  else if (VIEW === 'drop') setHTML(box, `<div style="display:flex;flex-direction:column;gap:5px">${shown.map(inlineHTML).join('')}</div>`);
  else setHTML(box, shown.map(cardHTML).join(''));
}
$('quota').addEventListener('click', (e) => {
  const b = e.target.closest('[data-sw]'); if (!b || !lastV) return;
  const shown = lastV.accounts.filter((a) => a.shown);
  oneIdx = Math.max(0, Math.min(oneIdx + Number(b.dataset.sw), shown.length - 1));
  send({ type: 'settings', patch: { popover_account: shown[oneIdx].id } });
  renderQuota(lastV);
});

/* ---------- 提示、已打开、页脚 ---------- */
const openNotices = new Set();
const NOTICE = {
  js: (b) => b === 'Safari' ? ['Safari 还不能读取网页状态', '① Safari › 设置 › 高级，勾选最底部的“显示网页开发者功能”<br>② 设置顶部会多出“开发者”标签页，在“自动化”里勾选“允许来自 Apple 事件的 JavaScript”']
    : [`${b} 还不能读取网页状态`, '菜单栏 显示 › 开发者 › 勾选“允许来自 Apple 事件的 JavaScript”。也可以改装浏览器扩展，token 数更准。'],
  automation: (b) => [`没有控制 ${b} 的权限`, `系统设置 › 隐私与安全性 › 自动化，打开“AI 活动”下的 ${b} 开关。`],
  ext: (b) => [`${b} 还没装连接扩展`, '打开 chrome://extensions（Edge 是 edge://extensions），打开“开发人员模式”，点“加载解压缩的扩展”，<br>选择 %LOCALAPPDATA%\\AIStatus\\extension，然后刷新 AI 网页。'],
  ax: () => ['桌面客户端还读不到状态', '需要允许一次“辅助功能”：系统设置 › 隐私与安全性 › 辅助功能，打开“AI 活动”。'],
};
function renderNotices(list) {
  const html = list.filter((n) => NOTICE[n.kind]).map((n) => {
    const [h, s] = NOTICE[n.kind](n.name), id = n.name + n.kind;
    return `<div class="notice ${openNotices.has(id) ? 'open' : ''}" data-id="${esc(id)}"><b>${esc(h)}</b>，点此查看方法<div class="steps">${s}</div></div>`;
  }).join('');
  setHTML($('notices'), html);
}
$('notices').addEventListener('click', (e) => {
  const n = e.target.closest('.notice'); if (!n) return;
  const id = n.dataset.id; openNotices.has(id) ? openNotices.delete(id) : openNotices.add(id);
  n.classList.toggle('open'); $('notices').dataset.h = '';
});
function renderIdle(idle, hasRows) {
  if (!idle.length) { setHTML($('idleWrap'), ''); return; }
  setHTML($('idleWrap'), `<div class="section">${hasRows ? '其他已打开' : '已打开'}</div><div class="chips">` + idle.map((c) =>
    `<div class="chip ${c.watch ? '' : 'unwatched'}" data-key="${esc(c.key)}" title="${esc(c.title || c.label)}${c.watch ? '' : '（未读取到状态）'}">${mini(c)}${esc(c.label)}<span class="where">${esc(c.place || '')}</span></div>`).join('') + '</div>');
}
$('idleWrap').addEventListener('click', (e) => { const c = e.target.closest('.chip'); if (c) send({ type: 'open', key: c.dataset.key }); });
document.querySelector('.foot').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.act === 'settings') send({ type: 'settings-open' });
  if (b.dataset.act === 'focus') $('fpick').classList.toggle('open');
});
$('fpick').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) send({ type: 'focus', minutes: Number(b.dataset.min) }); });

/* ---------- 脉搏线 ---------- */
const hist = new Array(90).fill(0);
function drawSpark(tps) {
  hist.push(tps); hist.shift();
  const max = Math.max(20, ...hist) * 1.15, W = 104, H = 30, n = hist.length;
  const pts = hist.map((v, i) => [i / (n - 1) * W, H - 3 - (v / max) * (H - 6)]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < n; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], cx = (x0 + x1) / 2; d += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`; }
  $('sparkLine').setAttribute('d', d); $('sparkFill').setAttribute('d', `${d} L${W},${H} L0,${H} Z`);
  const last = pts[n - 1]; $('sparkDot').setAttribute('cx', last[0]); $('sparkDot').setAttribute('cy', last[1]); $('sparkDot').style.opacity = tps > 0 ? 1 : 0;
}

/* ---------- 灵动岛（只显示紧凑胶囊；展开内容由原生层显示在菜单栏下方的下拉面板 view=drop） ---------- */
window.islandLayout = (L) => {
  const r = document.documentElement.style;
  r.setProperty('--ih', L.ih + 'px'); r.setProperty('--lw', (L.lw || 0) + 'px'); r.setProperty('--rw', (L.rw || 0) + 'px');
  r.setProperty('--ir', Math.round(L.ih * 0.42) + 'px');
  document.body.classList.remove('m-wings', 'm-left', 'm-right', 'm-none');
  document.body.classList.add('m-' + (L.mode || 'wings'));
};
if (VIEW === 'island') {
  window.islandLayout({ ih: Number(Q.get('ih') || 32), lw: Number(Q.get('lw') || 0), rw: Number(Q.get('rw') || 0),
    mode: Q.get('mode') || 'none' });
  $('isl').addEventListener('click', () => send({ type: 'island-click' }));
  $('isl').addEventListener('mouseenter', () => send({ type: 'island-hover', on: true }));
  $('isl').addEventListener('mouseleave', () => send({ type: 'island-hover', on: false }));
}
if (VIEW === 'drop') {
  document.addEventListener('mouseenter', () => send({ type: 'island-hover', on: true }));
  document.addEventListener('mouseleave', () => send({ type: 'island-hover', on: false }));
}
function renderIsland(v) {
  const s = v.summary || {}, p = v.primary, cs = companionState(v);
  document.querySelectorAll('#isl .dot').forEach((e) => { e.className = 'dot ' + (cs === 'idle' ? '' : cs) + (e.classList.contains('only-right') ? ' only-right' : ''); });
  document.querySelectorAll('#isl .cnt').forEach((e) => setText(e, s.working ? String(s.working) : ''));
  const txt = p ? p.headline : (s.working ? '进行中' : ''), lvl = p ? (p.level || '') : '';
  document.querySelectorAll('#isl .pct').forEach((e) => { setText(e, txt); e.className = 'pct ' + lvl + (e.classList.contains('only-left') ? ' only-left' : ''); });
}

/* ---------- 主渲染 ---------- */
let lastRender = 0;
window.render = function (v) {
  lastRender = Date.now();
  if (typeof v === 'string') v = JSON.parse(v);
  lastV = v;
  const ui = v.ui || {};
  document.body.classList.toggle('companion', !!ui.companion);
  if (ui.companion) { const cs = 'c-' + companionState(v);
    for (const el of [$('hcomp'), ...document.querySelectorAll('.icomp')]) if (el.dataset.c !== cs) { el.classList.remove('c-idle', 'c-working', 'c-waiting', 'c-done'); el.classList.add(cs); el.dataset.c = cs; } }
  renderQuota(v);
  renderRows(v.rows || []);
  const s = v.summary || {};
  let sum = s.working ? `${s.working} 个进行中` : '空闲';
  if (s.tps) sum += `，合计 ${Math.round(s.tps)} tok/s`;
  else if (!s.working && (v.idle || []).length) sum += `，已打开 ${v.idle.length} 个`;
  setText($('sum'), sum);
  drawSpark(s.tps || 0);
  renderNotices(v.notices || []);
  renderIdle(v.idle || [], (v.rows || []).length > 0);
  if (VIEW === 'island') renderIsland(v);
};

if (VIEW !== 'island') new ResizeObserver(() => send({ type: 'height', h: Math.ceil($('app').getBoundingClientRect().height) })).observe($('app'));
if (HTTP) { const poll = () => fetch('/state', { cache: 'no-store' }).then((r) => r.json()).then(window.render).catch(() => {}); poll(); setInterval(poll, 500); }
if (bridge) setInterval(() => { if (Date.now() - lastRender > 1500) fetch('http://127.0.0.1:47823/state').then((r) => r.json()).then((v) => { window.render(v); lastRender = 0; }).catch(() => {}); }, 1000);

/* ---------- 演示数据（直接用浏览器打开时） ---------- */
if (!bridge && !HTTP) {
  const t0 = Date.now() / 1000;
  for (let i = 0; i < hist.length; i++) hist[i] = i < 30 ? 0 : 40 + 30 * Math.abs(Math.sin(i / 7)) + (i % 5) * 3;
  const tick = () => window.render(demo(Date.now() / 1000 - t0)); tick(); setInterval(tick, 500);
}
function demo(dt) {
  const tps = 46 + Math.sin(dt) * 9;
  const A = (id, name, label, glyph, tint, extra) => Object.assign({ id, name, label, glyph, tint, windows: [], shown: true, age: 30, stale: false, level: 'ok' }, extra);
  const accounts = [
    A('claude:o1', 'Kevin', 'Claude 订阅', 'C', ['#E8916E', '#C9663F'], { windows: [{ key: 'five_hour', label: '5 小时', util: 63, resets_in: 7400 }, { key: 'seven_day', label: '本周', util: 41, resets_in: 300000 }], headline: '63%', headline_label: '5 小时', level: 'ok' }),
    A('claude-code', 'Claude Code', 'Claude Code 订阅', '›_', ['#E8916E', '#B4532E'], { windows: [{ key: 'five_hour', label: '5 小时', util: 78, resets_in: 3100 }, { key: 'seven_day', label: '本周', util: 52, resets_in: 300000 }], headline: '78%', headline_label: '5 小时', level: 'mid' }),
    A('moonshot-api', 'Kimi API', 'Kimi API 余额', 'K', ['#5B6478', '#2E3442'], { balance: { amount: 49.58, currency: 'CNY' }, headline: '¥49.58', headline_label: '余额' }),
  ];
  return {
    accounts, primary: accounts[0], prefs: { primary: 'claude:o1' }, ui: { companion: Q.get('companion') === '1' },
    rows: [
      { key: 'a', label: 'Claude', glyph: 'C', tint: ['#E8916E', '#C9663F'], place: 'Safari', title: '季度路演材料，第三部分改写', state: 'working', elapsed: 42 + dt, tokens: Math.round(1873 + tps * dt), est: true, tps, clickable: true },
      { key: 'b', label: 'Kimi 客户端', glyph: 'K', tint: ['#5B6478', '#2E3442'], place: '客户端', title: '文献综述提纲', state: 'working', elapsed: 9 + dt, clickable: true },
      { key: 'c', label: 'Claude Code', glyph: '›_', tint: ['#E8916E', '#B4532E'], place: 'web-app', title: '给登录页加上双因素验证', state: 'waiting', elapsed: 301 + dt, note: '需要你允许执行 Bash 命令' },
    ],
    idle: [{ key: 'e', label: '豆包', glyph: '豆', tint: ['#5C8DFF', '#3367E6'], place: 'Chrome', watch: true }, { key: 'f', label: 'DeepSeek', glyph: 'D', tint: ['#6F8BFF', '#3F5BE8'], place: 'Safari', watch: true }],
    notices: [], summary: { working: 3, tps },
  };
}
</script>
